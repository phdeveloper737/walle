; walle (só desenvolvimento): a pasta compartilhada do Windows aparece no contêiner como do root.
; Com o PHP-FPM como root, site, artisan, filas e agendador são todos o mesmo dono e não há erro de permissão.
; Na produção a imagem leva o código dentro e o PHP-FPM volta a rodar como www-data.
[www]
user = root
group = root
