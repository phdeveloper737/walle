; walle: ajustes do PHP (vale para site, filas e agendador)
date.timezone = America/Sao_Paulo
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
expose_php = Off

; OPcache: em desenvolvimento confere se o arquivo mudou no máximo a cada 2 s.
; Conferir a cada requisição deixa tudo lento na pasta compartilhada do Windows (~0,9 s por página).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Cache de caminhos de arquivo (também evita idas ao disco compartilhado)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
